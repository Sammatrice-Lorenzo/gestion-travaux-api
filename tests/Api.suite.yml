actor: ApiTester
suite_namespace: App\Tests\Api
modules:
    # enable helpers as array
    enabled:
        - Asserts
        - Symfony:
            app_path: 'src'
            environment: 'test'
        - REST:
            url: http://localhost:8000
            environment: 'test'
            depends: PhpBrowser
        - Doctrine:
            environment: 'test'
            depends: Symfony
            cleanup: true
    config:
        PhpBrowser:
            url: http://localhost:8000
            environment: 'test'
            curl:
                CURLOPT_TIMEOUT: 60
                CURLOPT_CONNECTTIMEOUT: 10
            headers:
               Content-Type: application/json
extensions:
    enabled:
        - Codeception\Extension\RunProcess:
            0: php tests/bin/set-test-env.php
            1: symfony local:server:stop
            2: symfony local:server:start --port=8000 --no-tls --daemon
            sleep: 10
