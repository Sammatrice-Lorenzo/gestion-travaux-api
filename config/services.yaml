# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    invoice_example_directory: '%kernel.project_dir%/public/invoice/'
    font_generator_directory: '%kernel.project_dir%/src/FontPDFGenerator'
    products_invoice: '%kernel.project_dir%/public/products-invoice/'
    supplier_return_invoices: '%kernel.project_dir%/public/supplier-return-invoices/'
    work_images: '%kernel.project_dir%/public/work-images/'
    url_front: '%env(URL_GESTION_TRAVAUX_PWA)%'
    mail_username: '%env(MAIL_USERNAME)%'
    env: '%env(APP_ENV)%'
    firebase_admin: '%kernel.project_dir%/config/gestion-travaux-firebase-admin.json'
    # Moniteurs heartbeat GlitchTip : URL appelée (POST) après chaque exécution réussie d'une tâche planifiée.
    # Sans appel dans l'intervalle prévu, GlitchTip alerte (worker arrêté, tâche en échec). Valeur vide = désactivé.
    scheduler_heartbeat_urls:
        'app:qonto:sync-supplier-invoices': '%env(QONTO_SYNC_HEARTBEAT_URL)%'
services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\EventListener\UniqueConstraintViolationListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\OpenApi\OpenApiFactory:
        decorates: 'api_platform.openapi.factory'
        arguments: ['@App\OpenApi\OpenApiFactory.inner']
        autoconfigure: false
