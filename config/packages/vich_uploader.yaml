vich_uploader:
    db_driver: orm

    mappings:
        products_invoice:
            uri_prefix: /products-invoice
            upload_destination: '%kernel.project_dir%/public/products-invoice'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        supplier_return_invoices:
            uri_prefix: /supplier-return-invoices
            upload_destination: '%kernel.project_dir%/public/supplier-return-invoices'
            namer:
                service: App\Naming\SupplierReturnInvoiceNamer
            directory_namer:
                service: App\Naming\SupplierReturnInvoiceDirectoryNamer
        work_images:
            uri_prefix: /work-images
            upload_destination: '%kernel.project_dir%/public/work-images'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
