# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    http_method_override: false

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    #esi: true
    #fragments: true
    php_errors:
        log: true

    handle_all_throwables: true

    http_client:
        scoped_clients:
            # Autowiré via `HttpClientInterface $qontoClient`. Clé API (login:secret, sans Base64) uniquement côté serveur.
            qonto.client:
                base_uri: '%env(QONTO_BASE_URL)%'
                headers:
                    Accept: 'application/json'
                    Authorization: '%env(QONTO_LOGIN)%:%env(QONTO_SECRET_KEY)%'
                # Réessaie les 423/425/429/5xx (codes par défaut) avec un délai exponentiel.
                retry_failed:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2

    annotations:
        enabled: false

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
