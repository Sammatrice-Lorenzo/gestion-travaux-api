api_platform:
    use_symfony_listeners: true
    serializer:
        hydra_prefix: true
    keep_legacy_inflector: false
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
        html: ['text/html']
        multipart: ['multipart/form-data']
        pdf: ['application/pdf']
        zip: ['application/zip']
    mapping:
        paths: ['%kernel.project_dir%/src']
