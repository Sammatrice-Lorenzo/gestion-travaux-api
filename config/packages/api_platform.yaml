api_platform:
    use_symfony_listeners: true
    serializer:
        hydra_prefix: true
    defaults:
        extra_properties:
            # PUT keeps the partial-update semantics the frontend relies on (fields absent from the payload are left untouched).
            # API Platform 4 defaults to a full replacement, which would reset non-writable fields such as the owner `user`.
            standard_put: false
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
        html: ['text/html']
        multipart: ['multipart/form-data']
        pdf: ['application/pdf']
        zip: ['application/zip']
    mapping:
        paths: ['%kernel.project_dir%/src']
