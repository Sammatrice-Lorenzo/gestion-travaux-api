when@prod:
  sentry:
    dsn: '%env(SENTRY_DSN)%'
    options:
      environment: '%env(default::SENTRY_ENVIRONMENT)%'
      send_default_pii: false
      traces_sample_rate: 0   # GlitchTip gère mal le tracing, on garde juste les erreurs
      ignore_exceptions:
        - Symfony\Component\HttpKernel\Exception\NotFoundHttpException
        - Symfony\Component\Security\Core\Exception\AccessDeniedException

  # Handlers Monolog branchés dans monolog.yaml : les erreurs attrapées et journalisées par l'appli remontent aussi.
  services:
    Sentry\Monolog\LogToSentryIssueHandler:
      arguments:
        $hub: '@Sentry\State\HubInterface'
        $level: !php/enum Monolog\Level::Error
        $fillExtraContext: true

    Sentry\Monolog\ExceptionToSentryIssueHandler:
      arguments:
        $hub: '@Sentry\State\HubInterface'
        $level: !php/enum Monolog\Level::Error
