name: Setup & Test Symfony Backend
description: Installe les dépendances, configure l'env et lance les tests

inputs:
    mysql_database:
        required: true
    mysql_root_password:
        required: true
    backend_path:
        required: true
    mysql_host:
        required: false
        default: '127.0.0.1'

runs:
    using: 'composite'
    steps:
        - name: Setup PHP extensions
          uses: shivammathur/setup-php@v2
          with:
              php-version: '8.3'
              extensions: gd, sodium, curl, zip, pdo_mysql
              tools: composer
              coverage: none

        - name: Set DATABASE_URL
          shell: bash
          env:
              MYSQL_ROOT_PASSWORD: ${{ inputs.mysql_root_password }}
              MYSQL_DATABASE: ${{ inputs.mysql_database }}
              MYSQL_HOST: ${{ inputs.mysql_host }}
          run: |
              BACKEND="${GITHUB_WORKSPACE}/${{ inputs.backend_path }}"
              echo "DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@${MYSQL_HOST}:3306/${MYSQL_DATABASE}" > "${BACKEND}/.env.test.local"
              echo "APP_ENV=test" >> "${BACKEND}/.env.test.local"
              echo "DATABASE_SERVER_VERSION=8.4" >> "${BACKEND}/.env.test.local"

        - name: Configure Git safe.directory
          shell: bash
          run: git config --global --add safe.directory "${GITHUB_WORKSPACE}/${{ inputs.backend_path }}"

        - name: Composer install
          shell: bash
          run: composer install --prefer-dist --no-progress --no-scripts --working-dir="${GITHUB_WORKSPACE}/${{ inputs.backend_path }}"

        - name: Update permissions on vendor
          run: sudo chmod -R 777 "${GITHUB_WORKSPACE}/${{ inputs.backend_path }}/vendor/"
          shell: bash

        - name: Install backend Yarn dependencies
          shell: bash
          run: yarn install --frozen-lockfile --ignore-scripts
          working-directory: ${{ inputs.backend_path }}

        - name: Install Symfony CLI
          shell: bash
          run: |
              curl -sS https://get.symfony.com/cli/installer | bash
              mv ~/.symfony*/bin/symfony /usr/local/bin/symfony

        - name: Install JWT keys
          shell: bash
          run: php bin/console lexik:jwt:generate-keypair --skip-if-exists
          working-directory: ${{ inputs.backend_path }}
